<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo · STEF</title>
  <link rel="icon" type="image/png" href="assets/img/logo-marca.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@500&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="Componentes/global.css">
  <link rel="stylesheet" href="modulo_catalogo/catalogo.css">
</head>
<body>
  <!-- ### Encabezado ### -->
  <header id="header"></header>

  <main>
    <!-- ### Cabecera catálogo ### -->
    <section class="cabecera-catalogo">
      <p class="seccion-etiqueta" id="migas">TIENDA  /  TODO</p>
      <div class="cabecera-catalogo-fila">
        <h1 class="cabecera-catalogo-titulo" id="titulo-catalogo">TODO EL CATÁLOGO</h1>
        <p class="texto-mono texto-muted" id="total-productos">0 PRODUCTOS</p>
      </div>
      <div class="chips" id="chips-categorias" role="tablist" aria-label="Categorías"></div>
    </section>

    <!-- ### Cuerpo ### -->
    <section class="cuerpo-catalogo">
      <!-- ### Filtros ### -->
      <aside class="filtros" id="filtros" aria-label="Filtros">
        <fieldset class="filtro-grupo">
          <legend>TALLA</legend>
          <div id="filtro-tallas"></div>
        </fieldset>
        <fieldset class="filtro-grupo">
          <legend>COLOR</legend>
          <div id="filtro-colores"></div>
        </fieldset>
        <fieldset class="filtro-grupo">
          <legend>PRECIO</legend>
          <div id="filtro-precios"></div>
        </fieldset>
        <fieldset class="filtro-grupo">
          <legend>DISPONIBILIDAD</legend>
          <label class="check"><input type="checkbox" id="filtro-stock"><span>Solo en stock</span></label>
        </fieldset>
        <button type="button" class="filtros-limpiar" id="limpiar-filtros">LIMPIAR FILTROS</button>
      </aside>

      <!-- ### Listado ### -->
      <div class="listado">
        <div class="listado-barra">
          <button type="button" class="boton boton-fantasma filtros-toggle" id="toggle-filtros" aria-controls="filtros" aria-expanded="false">Filtros</button>
          <p class="texto-mono texto-muted listado-conteo" id="texto-mostrando">MOSTRANDO 0 DE 0</p>
          <label class="ordenar">
            <span>ORDENAR:</span>
            <select id="ordenar">
              <option value="nuevo">MÁS NUEVO</option>
              <option value="precio-asc">MENOR PRECIO</option>
              <option value="precio-desc">MAYOR PRECIO</option>
              <option value="nombre">NOMBRE A – Z</option>
            </select>
          </label>
        </div>
        <div class="listado-grid" id="grid-productos"></div>
        <nav class="paginacion" id="paginacion" aria-label="Paginación"></nav>
      </div>
    </section>
  </main>

  <!-- ### Pie de página ### -->
  <footer id="footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.22.0/dist/sweetalert2.all.min.js"></script>
  <script src="Componentes/datos.js"></script>
  <script src="Componentes/almacen.js"></script>
  <script src="Componentes/componentes.js"></script>
  <script src="modulo_catalogo/catalogo.js"></script>
</body>
</html>
