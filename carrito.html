<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrito · STEF</title>
  <link rel="icon" type="image/png" href="assets/img/logo-marca.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@500&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="Componentes/global.css">
  <link rel="stylesheet" href="modulo_carrito/carrito.css">
</head>
<body>
  <!-- ### Encabezado ### -->
  <header id="header"></header>

  <main>
    <!-- ### Cabecera ### -->
    <section class="cabecera-pagina">
      <p class="seccion-etiqueta" id="etiqueta-bolsa">— TU BOLSA · 0 PRODUCTOS</p>
      <h1>Carrito</h1>
    </section>

    <!-- ### Cuerpo ### -->
    <section class="cuerpo-carrito">
      <div class="lineas-carrito">
        <!-- ### Líneas ### -->
        <div id="lineas"></div>

        <!-- ### Código de descuento ### -->
        <form class="cupon" id="form-cupon" novalidate>
          <div class="campo">
            <label for="input-cupon">CÓDIGO DE DESCUENTO</label>
            <input type="text" id="input-cupon" placeholder="STEF10" autocomplete="off">
          </div>
          <button type="submit" class="boton boton-fantasma cupon-boton">Aplicar</button>
        </form>
      </div>

      <!-- ### Resumen ### -->
      <aside class="resumen" aria-label="Resumen del pedido">
        <p class="seccion-etiqueta">RESUMEN</p>
        <div class="resumen-fila"><span id="label-subtotal">Subtotal (0)</span><span id="valor-subtotal">$0</span></div>
        <div class="resumen-fila" id="fila-descuento" hidden><span id="label-descuento">Descuento</span><span id="valor-descuento">−$0</span></div>
        <div class="resumen-fila"><span>Envío</span><span id="valor-envio">Gratis</span></div>
        <div class="resumen-linea"></div>
        <div class="resumen-fila resumen-total"><span>Total</span><span id="valor-total">$0</span></div>
        <a href="checkout.html" class="boton boton-primario boton-ancho" id="ir-pagar">Ir a pagar</a>
        <a href="catalogo.html" class="boton boton-fantasma boton-ancho">Seguir comprando</a>
        <p class="resumen-nota">Envío gratis desde $250.000. Cambios dentro de 15 días.</p>
      </aside>
    </section>
  </main>

  <!-- ### Pie de página ### -->
  <footer id="footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.22.0/dist/sweetalert2.all.min.js"></script>
  <script src="Componentes/datos.js"></script>
  <script src="Componentes/almacen.js"></script>
  <script src="Componentes/componentes.js"></script>
  <script src="modulo_carrito/carrito.js"></script>
</body>
</html>
